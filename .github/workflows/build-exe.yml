# Builds ShadowingApp.exe (the window of src/shadowing_gui.py) with FFmpeg next to it, tests it, and zips it.
# Push a tag like v1.0 to also publish the zip as a GitHub Release; "Run workflow" on the Actions page only
# builds it (the zip is then under the run's Artifacts).
name: Build Windows exe

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: pip install -r requirements.txt pyinstaller

      - name: Build exe
        # the engines are imported by name at run time, so PyInstaller must be told about them
        run: >
          pyinstaller --noconfirm --onedir --windowed --name ShadowingApp --paths src
          --hidden-import run_lesson --hidden-import google_shadowing_app --hidden-import edge_tts_shadowing_app
          src/shadowing_gui.py

      - name: Add FFmpeg (LGPL build, shared libraries) and the user guide
        run: |
          Invoke-WebRequest https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl-shared.zip -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip ffmpeg_x
          $fb = (Get-ChildItem ffmpeg_x -Directory)[0].FullName
          Copy-Item "$fb\bin\*.dll", "$fb\bin\ffmpeg.exe", "$fb\bin\ffprobe.exe" dist\ShadowingApp
          Copy-Item "$fb\LICENSE.txt" dist\ShadowingApp\FFmpeg-LICENSE.txt
          Copy-Item packaging\HOW_TO_USE.txt dist\ShadowingApp

      - name: Self-test (build the example lesson with Edge-TTS)
        run: |
          $p = Start-Process dist\ShadowingApp\ShadowingApp.exe -ArgumentList "--selftest" -Wait -PassThru
          Get-Content dist\ShadowingApp\output\selftest.log
          if ($p.ExitCode -ne 0) { exit 1 }
          Remove-Item dist\ShadowingApp\output -Recurse -Force

      - name: Zip
        run: Compress-Archive -Path dist\ShadowingApp -DestinationPath ShadowingApp-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ShadowingApp-windows
          path: ShadowingApp-windows.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ShadowingApp-windows.zip
